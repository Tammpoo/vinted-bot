<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinted Notifications Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header {
            background: #1a1a1a;
            border-bottom: 2px solid #333;
            padding: 20px;
            margin-bottom: 30px;
        }
        header h1 { color: #00d4aa; font-size: 1.8em; }
        nav {
            background: #1a1a1a;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        nav a {
            color: #e0e0e0;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s;
        }
        nav a:hover, nav a.active {
            background: #00d4aa;
            color: #0f0f0f;
        }
        .card {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .card h2 {
            color: #00d4aa;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th { color: #00d4aa; font-weight: 600; }
        tr:hover { background: #252525; }
        input, textarea, select {
            background: #252525;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            margin-bottom: 10px;
            font-family: inherit;
        }
        button {
            background: #00d4aa;
            color: #0f0f0f;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover { background: #00b894; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #3498db; color: white; }
        .btn-secondary:hover { background: #2980b9; }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .status.active { background: #00d4aa33; color: #00d4aa; }
        .status.inactive { background: #e74c3c33; color: #e74c3c; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; }
        .item-card {
            background: #252525;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        .item-card img {
            width: 100%;
            max-width: 200px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .item-card .price { color: #00d4aa; font-size: 1.2em; font-weight: 600; }
        .item-card .title { font-weight: 500; margin-bottom: 5px; }
        .item-card .brand { color: #aaa; font-size: 0.9em; }
        .item-card a { color: #00d4aa; text-decoration: none; }
        .item-card a:hover { text-decoration: underline; }
        pre {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 0.85em;
            max-height: 500px;
            overflow-y: auto;
        }
        .alert {
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .alert-info { background: #3498db33; border: 1px solid #3498db; }
        .alert-success { background: #00d4aa33; border: 1px solid #00d4aa; }
        .alert-warning { background: #f39c1233; border: 1px solid #f39c12; }
        .version-info { color: #aaa; font-size: 0.9em; margin-top: 5px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <div class="container">
            <h1>Vinted Notifications Bot</h1>
            <div class="version-info">Versione {{ version }} {% if not is_up_to_date %}(Aggiornamento disponibile: {{ latest_version }}){% endif %}</div>
        </div>
    </header>
    <div class="container">
        <nav>
            <a href="/" {% if request.endpoint == 'index' %}class="active"{% endif %}>Dashboard</a>
            <a href="/queries" {% if request.endpoint == 'queries_page' %}class="active"{% endif %}>Query</a>
            <a href="/items" {% if request.endpoint == 'items_page' %}class="active"{% endif %}>Articoli</a>
            <a href="/allowlist" {% if request.endpoint == 'allowlist_page' %}class="active"{% endif %}>Allowlist</a>
            <a href="/config" {% if request.endpoint == 'config_page' %}class="active"{% endif %}>Configurazione</a>
            <a href="/logs" {% if request.endpoint == 'logs_page' %}class="active"{% endif %}>Log</a>
        </nav>
        {% block content %}{% endblock %}
    </div>
    <script>
        async function apiPost(url, data) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return await response.json();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
